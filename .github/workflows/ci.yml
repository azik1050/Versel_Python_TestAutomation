name: Smoke Suite
run-name: Smoke Tests
on:
  push:
    branches: [main]

jobs:
  initial-run:
    runs-on: ubuntu-latest
    steps:
      - name: setup project
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: install dependecies
        run: pip install -r requirements.txt

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/latest/download/allure-commandline.zip
          unzip allure-commandline.zip -d /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: run tests
        run: pytest -n auto -m smoke --alluredir=allure-results

      - name: post allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Create HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html
          path: allure-report

      - name: Add test summary
        if: always()
        run: |
          echo "## ✅ Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total tests: $(grep -o \"<testcase\" -r allure-results | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "Report: " >> $GITHUB_STEP_SUMMARY

