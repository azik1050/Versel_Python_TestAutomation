name: Regression Suite
run-name: Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  BASE_UI_URL: ${{ secrets.BASE_UI_URL }}
  BASE_API_URL: ${{ secrets.BASE_API_URL }}
  IMPLICIT_DRIVER_WAIT: ${{ secrets.IMPLICIT_DRIVER_WAIT }}
  BROWSER: ${{ secrets.BROWSER }}
  BASE_JIRA_API_URL: ${{ secrets.BASE_JIRA_API_URL }}
  JIRA_USER: ${{ secrets.JIRA_USER }}
  JIRA_PASSWORD: ${{ secrets.JIRA_PASSWORD }}

jobs:
  call-smoke-run:
    uses: ./.github/workflows/smoke.yml
    secrets:
      BASE_UI_URL: ${{ secrets.BASE_UI_URL }}
      BASE_API_URL: ${{ secrets.BASE_API_URL }}
      IMPLICIT_DRIVER_WAIT: ${{ secrets.IMPLICIT_DRIVER_WAIT }}
      BROWSER: ${{ secrets.BROWSER }}
      BASE_JIRA_API_URL: ${{ secrets.BASE_JIRA_API_URL }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_PASSWORD: ${{ secrets.JIRA_PASSWORD }}


  regression-run:
    needs: call-smoke-run
    runs-on: ubuntu-latest
    steps:
      - name: setup project
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: install dependecies
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest -n auto -m regression --alluredir=allure-results

      - name: post allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-regression-results
          path: allure-results

      - name: post application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: regression-logs